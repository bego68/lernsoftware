<div class="flex flex-col items-center p-4">

  <div *ngIf="isLoading" class="text-center">
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
    <p class="mt-4">Lade Karten...</p>
  </div>

  <mat-card *ngIf="!isLoading && sessionFinished" class="text-center p-8 max-w-lg w-full mat-elevation-z4">
    <mat-card-title class="text-3xl text-green-600">Super!</mat-card-title>
    <mat-card-content class="mt-4">
      <p>Du hast alle fälligen Karten für heute gelernt. Komm morgen wieder!</p>
    </mat-card-content>
    <mat-card-actions class="mt-6">
      <a mat-raised-button color="primary" routerLink="/dashboard">Zurück zum Dashboard</a>
    </mat-card-actions>
  </mat-card>

  <div *ngIf="!isLoading && currentCard" class="w-full max-w-2xl">

    <div class="mb-4 text-center">
      <p>Karte {{ currentIndex + 1 }} von {{ dueCards.length }}</p>
      <mat-progress-bar [value]="(currentIndex + 1) / dueCards.length * 100"></mat-progress-bar>
    </div>

    <mat-card class="min-h-[300px] flex flex-col justify-center items-center text-center mat-elevation-z8">
      <mat-card-content>
        <div *ngIf="!showBack">
          <h3 class="text-2xl">{{ currentCard.front.text }}</h3>
          <code *ngIf="currentCard.front.code" class="block bg-gray-800 text-white p-4 rounded-md mt-4">{{ currentCard.front.code }}</code>
        </div>
        <div *ngIf="showBack">
          <h3 class="text-2xl">{{ currentCard.back.text }}</h3>
          <code *ngIf="currentCard.back.code" class="block bg-gray-800 text-white p-4 rounded-md mt-4">{{ currentCard.back.code }}</code>
        </div>
      </mat-card-content>
    </mat-card>

    <div class="mt-8 flex justify-center items-center">
      <button *ngIf="!showBack" (click)="revealCard()" mat-raised-button color="primary" class="px-8 py-4">
        Antwort anzeigen
      </button>
      <div *ngIf="showBack" class="flex space-x-4">
        <button (click)="submitAnswer(false)" mat-raised-button color="warn" class="px-8 py-4">Falsch</button>
        <button (click)="submitAnswer(true)" mat-raised-button color="primary" class="px-8 py-4">Richtig</button>
      </div>
    </div>
  </div>
</div>
