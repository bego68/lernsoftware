<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">

    <div class="text-center">
      <h1 class="text-3xl font-bold text-gray-900">APT-Erfolg</h1>
      <p class="mt-2 text-sm text-gray-600">Bitte melden Sie sich an, um fortzufahren.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <div>
        <label for="username" class="text-sm font-medium text-gray-700">Benutzername</label>
        <input id="username" type="text" formControlName="username"
               class="w-full px-3 py-2 mt-1 text-gray-900 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
               required>
      </div>

      <div>
        <label for="password" class="text-sm font-medium text-gray-700">Passwort</label>
        <input id="password" type="password" formControlName="password"
               class="w-full px-3 py-2 mt-1 text-gray-900 bg-gray-50 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
               required>
      </div>

      <div *ngIf="errorMessage" class="p-3 text-sm text-red-700 bg-red-100 rounded-md">
        {{ errorMessage }}
      </div>

      <div>
        <button type="submit" [disabled]="loginForm.invalid"
                class="w-full px-4 py-2 text-lg font-medium text-white bg-blue-600 rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-gray-400">
          Anmelden
        </button>
      </div>

    </form>
  </div>
</div>
