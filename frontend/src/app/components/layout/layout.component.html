<div class="min-h-screen bg-gray-100">
  <!-- Header -->
  <header class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">

        <!-- Logo and Main Navigation -->
        <div class="flex items-center space-x-8">
          <div class="text-2xl font-bold text-blue-600">APT-Erfolg</div>
          <nav class="hidden md:flex space-x-4">
            <a routerLink="/dashboard" routerLinkActive="text-blue-600 border-b-2 border-blue-600"
               class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-blue-600">
              Dashboard
            </a>
            <a routerLink="/learn" routerLinkActive="text-blue-600 border-b-2 border-blue-600"
               class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-blue-600">
              Lernen
            </a>
            <a routerLink="/boss-fight" routerLinkActive="text-blue-600 border-b-2 border-blue-600"
               class="px-3 py-2 text-sm font-medium text-gray-700 hover:text-blue-600">
              Boss Arena
            </a>
          </nav>
        </div>

        <!-- Logout Button -->
        <div>
          <button (click)="logout()"
                  class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700">
            Abmelden
          </button>
        </div>

      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
